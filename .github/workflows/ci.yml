---
name: Build & Test

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pip install uv

    - name: Sync dependencies (all groups)
      run: uv sync --all-groups

    - name: Run ruff (lint)
      run: uv run ruff check .

    - name: Run yamllint
      run: uv run yamllint .

    # ruff excludes tests/*, so pre-commit is the only thing checking test files
    # for trailing whitespace and missing final newlines.
    - name: Run pre-commit
      run: uv run pre-commit run --all-files

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Pandoc
      uses: r-lib/actions/setup-pandoc@v2

    # TeX is only needed to render PDF; PDF tests skip cleanly without an engine,
    # so we install it on Linux only rather than pay the cost on every runner.
    - name: Install TeX Live (Linux only)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y texlive-xetex

    - name: Install uv
      run: pip install uv

    - name: Sync dependencies (all groups)
      run: uv sync --python "${{ matrix.python-version }}" --all-groups

    - name: Run pytest
      run: uv run pytest

    - name: Build project
      run: uv build

    - name: Test server imports
      run: uv run python -c "import mcp_pandoc; print('Server imports correctly')"

  # Single stable check to require in branch protection: green only when lint and
  # every matrix leg of test pass.
  ci-ok:
    name: CI OK
    if: ${{ always() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
    - name: Require every upstream job to pass
      run: >-
        test "${{ needs.lint.result }}" = success &&
        test "${{ needs.test.result }}" = success
